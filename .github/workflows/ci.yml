name: build and test

# The economics here are unusually good: clean build ~4s, full suite ~360 tests.
# There is no reason not to run it on every push.
#
# It would have caught the stale-binary incident independently: 38 /bin binaries
# were left linked against an older shim because $(V8DEPS) expanded to nothing,
# and the only reason it surfaced was a hand-run mutation test.  A clean-tree
# build in CI cannot be stale by construction.
#
# INJECTION SURFACE: none.  No step interpolates ${{ ... }} into a run: block --
# no issue titles, PR bodies, commit messages, branch names or any other
# attacker-controllable event field appears anywhere here.  Every step runs a
# fixed `make` target.  Keep it that way: if a step ever needs event data, pass
# it through `env:` and reference it as "$VAR" inside the shell, never inline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # ARM64, and pinned rather than `macos-latest`.
    #
    # Architecture is not a preference here: several of the bugs this port has
    # found are AAPCS64-specific -- Apple's variadic deviation above all -- so an
    # x64 runner would test something the project does not claim. The plain
    # `macos-26` and `macos-15` labels are arm64; x64 is now `-intel`/`-large`.
    #
    # macos-26 matches the machine this is developed on (Darwin 25.x). Pinned
    # because `macos-latest` migrates to the next OS over a 1-2 month window,
    # and this build is sensitive to its host toolchain -- make 3.81's
    # whole-second mtimes and lack of grouped targets are load-bearing here.
    #
    # NOT macos-14: deprecated, see actions/runner-images#13518.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      # v7 is current (v7.0.1, 2026-07-20). Pinned to the major tag so security
      # patches arrive without a workflow edit -- GitHub backported a breaking
      # `allow-unsafe-pr-checkout` change across every live major line in June
      # 2026, which is the kind of thing you want automatically. It concerns
      # `pull_request_target`; this workflow uses plain `pull_request`, so it
      # does not apply here.
      - uses: actions/checkout@v7

      - name: Toolchain versions
        # Recorded because two of them are load-bearing and version-sensitive:
        # make 3.81 has no grouped targets and compares mtimes at whole-second
        # granularity, and the stage-0 seed needs a host yacc for cpp's grammar
        # (V8's own yacc does not exist until rung 1).
        run: |
          uname -m
          clang --version | head -1
          make --version | head -1
          yacc --version 2>&1 | head -1 || echo "yacc: (bsd yacc, no --version)"

      - name: Build
        run: make -j3

      - name: Test
        run: make test

      # A clean build proves the graph can construct the world from nothing.
      # An incremental one proves it settles -- that a second make does no work.
      # Before the dependency audit, a no-op make recompiled 39 objects every
      # time, which is how a build gets slow enough that people take shortcuts.
      - name: Build must settle
        run: |
          busy=$(make 2>&1 | grep -cE '\-c \-o ' || true)
          if [ "$busy" -ne 0 ]; then
            echo "::error::a no-op make recompiled $busy objects; the graph does not settle"
            make -n | head -20
            exit 1
          fi
          echo "no-op make ran 0 compile steps"

      - name: Rebuild from clean, in parallel
        # -j is where a multi-target rule races under make 3.81, which reads
        # `a b: dep` as two rules sharing one recipe rather than a grouped
        # target. Serial passing does not prove parallel passing.
        run: |
          make clean
          make -j8
          make test

  # ---------------------------------------------------------------------------
  # THE CRASH PROBE, which is a SEPARATE JOB on purpose.
  #
  # It runs every installed Mach-O against its bare invocation and each of the
  # 52 single-letter options -- 6360 invocations -- looking for signal deaths.
  # That takes ~13 minutes locally, where `make test` takes well under one, so
  # putting it in the same job would triple the time-to-signal for every push
  # and people would stop reading the result. Two jobs run concurrently and
  # each reports on its own.
  #
  # WHY IT IS IN CI AT ALL. Its expected output is NOT zero -- a handful of
  # programs have defects a VAX had too, and PLAN.md S1 says record those
  # rather than patch them -- so it has a floor, and for most of this project's
  # life that floor lived in a sentence in CLAUDE.md. It rotted: it read 54
  # while the truth was 160, because four imports added 106 deaths and nothing
  # mechanically checked the number. A number only a human runs is a number
  # that rots. tests/crash-probe.floor is that number now, as a LIST so two
  # changes cannot cancel, and the script exits nonzero on any difference in
  # either direction.
  #
  # It is deliberately NOT in `make test`: 13 minutes is too slow for the
  # everyday command, and the everyday command is the one that must stay fast
  # enough to run without thinking. tests/wavea keeps a 2-second sweep of the
  # four programs most recently fixed, which is the fast half of the same
  # guard.
  # ---------------------------------------------------------------------------
  crash-probe:
    runs-on: macos-26
    # 13 minutes measured locally; a runner is slower and the probe is
    # dominated by process creation, which is exactly what a shared runner is
    # worst at. 45 leaves room without letting a genuine hang run for an hour.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make -j3

      # NOTHING MAY REBUILD DURING THE RUN. The probe treats SIGKILL as
      # "tainted" precisely because a concurrent rebuild replacing a Mach-O
      # mid-execution kills it, and a tainted run cannot testify either way --
      # so the script now fails rather than reporting those as findings.
      - name: Crash probe (floor asserted)
        run: v8/tests/crash-probe.sh "$PWD/v8/rootfs" "$RUNNER_TEMP/probework"

      # The MUTATES set: programs that change things inside the jail, each
      # invocation in its own `cp -ac` clone of the rootfs. Expected to be
      # entirely clean -- an empty expectation, which is the strongest kind.
      - name: Crash probe, mutating set
        env:
          PROBE: mutating
        run: v8/tests/crash-probe.sh "$PWD/v8/rootfs" "$RUNNER_TEMP/probemut"
